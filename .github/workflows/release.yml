name: Build NOTEZ Production — v0.1.0

# Satu-satunya jalur rilis signed. Manual + konfirmasi eksplisit.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik BUILD-v0.1.0 untuk konfirmasi'
        required: true

jobs:
  release:
    if: github.event.inputs.confirm == 'BUILD-v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - name: Install platform + build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: 8.5

      - name: Materialize keystore (ephemeral)
        run: |
          echo "${{ secrets.NOTEZ_KEYSTORE_B64 }}" | base64 -d > /tmp/notez-release.keystore
          echo "keystore siap (sementara, di-shred setelah build)"

      - name: Build signed release APK
        env:
          NOTEZ_KEYSTORE: /tmp/notez-release.keystore
          NOTEZ_STORE_PASS: ${{ secrets.NOTEZ_STORE_PASS }}
          NOTEZ_KEY_ALIAS: ${{ secrets.NOTEZ_KEY_ALIAS }}
          NOTEZ_KEY_PASS: ${{ secrets.NOTEZ_KEY_PASS }}
        run: gradle assembleRelease --console=plain

      - name: Verify signature + badging
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          ${ANDROID_HOME}/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package:"
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Shred keystore
        if: always()
        run: shred -u /tmp/notez-release.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notez-v0.1.0-release
          path: app/build/outputs/apk/release/app-release.apk
